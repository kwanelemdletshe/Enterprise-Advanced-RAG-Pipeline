name: Enterprise RAG Quality Evaluation CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  evaluate-rag-quality:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_PROJECT_ENDPOINT: ${{ secrets.AZURE_PROJECT_ENDPOINT }}
      AZURE_PROJECT_NAME: ${{ secrets.AZURE_PROJECT_NAME }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_INFERENCE_ENDPOINT: ${{ secrets.AZURE_INFERENCE_ENDPOINT }}
      AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
      AZURE_SEARCH_INDEX_NAME: ${{ secrets.AZURE_SEARCH_INDEX_NAME }}
      AZURE_LLM_DEPLOYMENT_NAME: gpt-5-mini
      AZURE_EMBEDDING_DEPLOYMENT_NAME: text-embedding-3-large

    steps:
    - name: Check out repository code tree
      uses: actions/checkout@v4

    - name: Provision Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Provision Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run local tests
      run: python -m pytest tests/test_parser.py tests/test_inference.py tests/test_query_pipeline.py -q

    - name: Authenticate to Microsoft Azure (Keyless OIDC Identity Federated Mapping)
      if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' }}
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Run Programmatic Evaluation Test Suite
      if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_PROJECT_ENDPOINT != '' && env.AZURE_PROJECT_NAME != '' && env.AZURE_RESOURCE_GROUP != '' && env.AZURE_INFERENCE_ENDPOINT != '' && env.AZURE_SEARCH_ENDPOINT != '' && env.AZURE_SEARCH_INDEX_NAME != '' }}
      run: python -m pytest tests/test_evaluation.py -v -s

    - name: Skip live evaluation when Azure configuration is incomplete
      if: ${{ env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == '' || env.AZURE_SUBSCRIPTION_ID == '' || env.AZURE_PROJECT_ENDPOINT == '' || env.AZURE_PROJECT_NAME == '' || env.AZURE_RESOURCE_GROUP == '' || env.AZURE_INFERENCE_ENDPOINT == '' || env.AZURE_SEARCH_ENDPOINT == '' || env.AZURE_SEARCH_INDEX_NAME == '' }}
      run: echo "Live Azure evaluation skipped; configure the required repository secrets to enable it."
